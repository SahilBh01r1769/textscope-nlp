name: tests

on:
  push:
    branches: [main, portfolio/evidence-aware-nlp-workbench, demo/hosted-textscope]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app.py nlp_core.py streamlit_app.py tests
      - name: Test
        run: python -m pytest -q
